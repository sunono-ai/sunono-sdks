name: flutter

on:
  push:
    branches: [main]
    tags: ['flutter-v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: git --no-pager diff
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: dart pub publish --dry-run

  # Tag `flutter-v<version>` (matching pubspec) to publish. Needs pub.dev
  # "Automated publishing" on for this repo with tag pattern
  # `flutter-v{{version}}`. Auth is GitHub OIDC: no stored secret.
  publish:
    if: startsWith(github.ref, 'refs/tags/flutter-v')
    needs: test
    runs-on: ubuntu-latest
    environment: pub.dev # requires approval; pub.dev can also require this environment
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1 # configures the pub.dev OIDC token
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter pub publish --force
