name: flutter

on:
  push:
    branches: [main]
    tags: ['flutter-v*']
  pull_request:
  schedule:
    - cron: '17 6 * * 1' # weekly: catch upstream Flutter/Dart breakage

permissions:
  contents: read

jobs:
  matrix:
    name: test (${{ matrix.flutter-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared floor, the Flutter we know hosts run, and the moving target.
        flutter-version: ['3.27.x', '3.44.x', 'stable']
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version != 'stable' && matrix.flutter-version || '' }}
      - run: flutter pub get
      # Format and publish checks once, on the moving target.
      - if: matrix.flutter-version == 'stable'
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - if: matrix.flutter-version == 'stable'
        run: dart pub publish --dry-run

  # The single required check on main: green only when every matrix leg is.
  test:
    needs: matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.matrix.result }}" = success

  # Tag `flutter-v<version>` (matching pubspec) to publish. Needs pub.dev
  # "Automated publishing" on for this repo with tag pattern
  # `flutter-v{{version}}`. Auth is GitHub OIDC: no stored secret.
  publish:
    if: startsWith(github.ref, 'refs/tags/flutter-v')
    needs: test
    runs-on: ubuntu-latest
    environment: pub.dev # requires approval; pub.dev can also require this environment
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1 (configures the pub.dev OIDC token)
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter pub publish --force
